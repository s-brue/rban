name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.binary_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            binary_name: rban-linux-x86_64
            use_cross: false

          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            binary_name: rban-linux-aarch64
            use_cross: true

          # Both macOS binaries are built on the arm64 runner: macos-13 and macos-14 are no longer offered
          # (the jobs stay queued or are cancelled), and the Intel binary is cross-compiled with the extra target.
          - target: x86_64-apple-darwin
            os: macos-latest
            binary_name: rban-macos-x86_64
            use_cross: false

          - target: aarch64-apple-darwin
            os: macos-latest
            binary_name: rban-macos-aarch64
            use_cross: false

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      # UPX is not used: a UPX binary decompresses itself (about 30 MB) on every run, which made startup
      # take ~150 ms instead of ~5 ms. The release archive is a plain .tar.gz of the binary, on every OS.
      - name: Package (tar.gz)
        run: |
          cp target/${{ matrix.target }}/release/rban rban
          tar czf ${{ matrix.binary_name }}.tar.gz rban
          rm rban

      - name: Upload to release
        uses: ncipollo/release-action@v1
        with:
          artifacts: ${{ matrix.binary_name }}.tar.gz
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          token: ${{ secrets.GITHUB_TOKEN }}
