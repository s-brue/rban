# Fonts in the rotation (--rand, --all). Comment out with # the ones you don't want.
# [default]:  the font used when no font option is given.
# [fonts]:    plain FIGlet fonts, no color (./ascii).
# [gradient]: TAAG's "ANSI" FIGlet fonts (block style); drawn with a color gradient.
# [ansi]:     TheDraw (.tdf, in ./ansi), with their own colors (Stargate Cya, Bleach...).
#             A single '*' in [ansi] = all of them, without listing them.
# With -f NAME any font in ./ascii or ./ansi works, whether or not it is listed here.
# Names ignore case, spaces, hyphens and underscores.

[default]
# The font used when no font option is given (-f, --rand, --all). If this section is missing, the first font listed
# below is used. It does not have to be listed in the rotation.
blocky

